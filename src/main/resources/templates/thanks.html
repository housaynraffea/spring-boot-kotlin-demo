<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head}">
        <title>Thank you!</title>
    </head>
    <body class="bg">
        <div class="center">
            <div th:replace="~{fragments/layout :: nav}"></div>
            <h1 th:text="'Thank you, ' + ${name} + '!'"></h1>
            <p>
                Thank you for contacting me!
                <br>Unfortunately, for a very silly and funny reason,
                <br>I have no way to really read your message.
                <br>Your message wasn't even sent somewhere.
                <br>But hey! If you wrote something nice, thank you!
                <br>If you wrote something really mean, though...
            </p>
        </div>
    </body>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</html>
